<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Nueva operación</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding page">

  <!-- Resultado en vivo -->
  <div class="result" [class.result--sell]="tipoOperacion === 'venta'">
    <span class="result__label">Total en pesos</span>
    <div class="result__value">${{ (totalPesos || 0) | number:'1.2-2' }}</div>
    <span class="result__hint" *ngIf="dolarSeleccionado && monto">
      {{ monto }} USD · {{ tipoOperacion | titlecase }} {{ dolarSeleccionado.nombre }}
    </span>
    <span class="result__hint" *ngIf="!dolarSeleccionado || !monto">
      Completá los datos para ver el total
    </span>
  </div>

  <!-- Formulario -->
  <div class="form-card">
    <label class="form-card__label">Tipo de operación</label>
    <ion-segment class="seg" [(ngModel)]="tipoOperacion" (ionChange)="calcularTotal()">
      <ion-segment-button value="compra">Compra</ion-segment-button>
      <ion-segment-button value="venta">Venta</ion-segment-button>
    </ion-segment>

    <ion-select
      class="app-input"
      label="Tipo de dólar"
      labelPlacement="floating"
      fill="outline"
      interface="action-sheet"
      placeholder="Seleccioná una cotización"
      [(ngModel)]="dolarSeleccionado"
      (ionChange)="calcularTotal()">
      <ion-select-option *ngFor="let d of cotizaciones" [value]="d">
        {{ d.nombre }} — Compra {{ d.compra }} / Venta {{ d.venta }}
      </ion-select-option>
    </ion-select>

    <ion-input
      class="app-input"
      label="Monto en USD"
      labelPlacement="floating"
      fill="outline"
      type="number"
      inputmode="decimal"
      [(ngModel)]="monto"
      (ionInput)="calcularTotal()">
      <span slot="start" class="input-prefix">US$</span>
    </ion-input>

    <ion-button expand="block" class="btn-primary" (click)="crearOperacion()">
      <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>
      Confirmar operación
    </ion-button>
  </div>

</ion-content>
