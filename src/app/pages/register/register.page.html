<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Crear cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding page">
  <div class="reg">
    <p class="reg__intro">Completá tus datos para empezar a operar.</p>

    <form (ngSubmit)="onRegister()" class="reg__form">
      <ion-input
        class="app-input"
        label="Nombre"
        labelPlacement="floating"
        fill="outline"
        [(ngModel)]="user.nombre"
        name="nombre"
        required>
      </ion-input>

      <ion-input
        class="app-input"
        label="Apellido"
        labelPlacement="floating"
        fill="outline"
        [(ngModel)]="user.apellido"
        name="apellido"
        required>
      </ion-input>

      <ion-input
        class="app-input"
        label="Fecha de nacimiento"
        labelPlacement="floating"
        fill="outline"
        type="text"
        placeholder="DD/MM/AAAA"
        [(ngModel)]="user.fechaNacimiento"
        name="fechaNacimiento"
        required>
      </ion-input>

      <ion-input
        class="app-input"
        label="DNI"
        labelPlacement="floating"
        fill="outline"
        inputmode="numeric"
        [(ngModel)]="user.dni"
        name="dni"
        required>
      </ion-input>

      <ion-input
        class="app-input"
        label="Email"
        labelPlacement="floating"
        fill="outline"
        type="email"
        [(ngModel)]="user.email"
        name="email"
        required>
      </ion-input>

      <ion-input
        class="app-input"
        label="Contraseña"
        labelPlacement="floating"
        fill="outline"
        type="password"
        [(ngModel)]="user.password"
        name="password"
        required>
      </ion-input>

      <ion-button expand="block" type="submit" class="btn-primary">
        Registrarme
      </ion-button>
    </form>

    <div class="reg__alt">
      <span>¿Ya tenés cuenta?</span>
      <ion-button fill="clear" size="small" routerLink="/login">Iniciar sesión</ion-button>
    </div>
  </div>
</ion-content>
