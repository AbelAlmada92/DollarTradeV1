<ion-content class="auth" [fullscreen]="true">
  <div class="auth__wrap">

    <div class="brand">
      <div class="brand__badge">
        <ion-icon name="trending-up-outline"></ion-icon>
      </div>
      <h1 class="brand__title">DollarTrade</h1>
      <p class="brand__subtitle">Gestioná tus operaciones de cambio en un solo lugar</p>
    </div>

    <form (ngSubmit)="onLogin()" class="auth__form">
      <ion-input
        class="app-input"
        label="Email"
        labelPlacement="floating"
        fill="outline"
        type="email"
        [(ngModel)]="email"
        name="email"
        required>
      </ion-input>

      <ion-input
        class="app-input"
        label="Contraseña"
        labelPlacement="floating"
        fill="outline"
        type="password"
        [(ngModel)]="password"
        name="password"
        required>
      </ion-input>

      <ion-button expand="block" type="submit" class="btn-primary">
        Ingresar
      </ion-button>
    </form>

    <div class="auth__alt">
      <span>¿No tenés cuenta?</span>
      <ion-button fill="clear" size="small" routerLink="/register">Crear cuenta</ion-button>
    </div>

  </div>
</ion-content>
